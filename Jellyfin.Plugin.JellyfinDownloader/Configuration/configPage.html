<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <title>Jellyfin Downloader</title>
</head>
<body>
  <div id="JellyfinDownloaderConfigPage" data-role="page" class="page type-interior pluginConfigurationPage">
  <style>
    /* 统一节奏：每个配置项固定两行
       第一行 = 标题 + 状态/输入框/操作按钮
       第二行 = 描述（后端服务 / 端口 / Python 解释器）或 输入框（媒体目录 / 暂存目录） */
    #JellyfinDownloaderConfigPage .jdl-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    #JellyfinDownloaderConfigPage .jdl-row + .jdl-row { margin-top: 6px; }

    /* 第一行的标签统一占位，后面的控件因此对齐到同一列 */
    #JellyfinDownloaderConfigPage .jdl-row .inputLabel {
      margin: 0;
      flex: 0 0 96px;
    }

    #JellyfinDownloaderConfigPage .jdl-row .fieldDescription { margin: 0; }

    #JellyfinDownloaderConfigPage .jdl-row__actions {
      margin-left: auto;
      display: inline-flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* 第一行里的输入框：统一固定宽度，不随状态文案伸缩 */
    #JellyfinDownloaderConfigPage .emby-input.jdl-input-inline {
      width: 300px;
      flex: 0 0 300px;
    }

    /* 第二行里的整行输入框 */
    #JellyfinDownloaderConfigPage .emby-input.jdl-input-block { width: 100%; }

    /* 资源站列表：一行一个站，字段自动换行 */
    #JellyfinDownloaderConfigPage .jdl-site {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: flex-end;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    #JellyfinDownloaderConfigPage .jdl-site__field {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1 1 180px;
    }

    #JellyfinDownloaderConfigPage .jdl-site__field > span { font-size: 12px; opacity: 0.75; }

    #JellyfinDownloaderConfigPage .jdl-site__remove { flex: 0 0 auto; }

    #JellyfinDownloaderConfigPage .jdl-site + .jdl-site { margin-top: 0; }
  </style>
    <div data-role="content">
      <div class="content-primary">
        <form id="jdl-config-form">
          <div class="inputContainer">
            <div class="jdl-row">
              <label class="inputLabel inputLabelUnfocused">后端服务</label>
              <span id="jdl-backend-status" class="fieldDescription">正在运行</span>
              <span id="jdl-backend-diag" class="fieldDescription"></span>
              <span class="jdl-row__actions">
                <button id="jdl-backend-refresh" type="button" is="emby-button" class="raised">刷新状态</button>
                <button id="jdl-backend-restart" type="button" is="emby-button" class="raised">重启后端</button>
              </span>
            </div>
            <div class="jdl-row">
              <span class="fieldDescription">随插件自动启动，异常时点「重启后端」。</span>
            </div>
          </div>

          <div class="inputContainer">
            <div class="jdl-row">
              <label class="inputLabel inputLabelUnfocused" for="jdl-port">端口</label>
              <input id="jdl-port" type="number" min="1" max="65535" step="1" class="emby-input jdl-input-inline" />
            </div>
            <div class="jdl-row">
              <span class="fieldDescription">后端在本机监听的端口，默认 8123；保存后会自动重启后端。</span>
            </div>
          </div>

          <div class="inputContainer">
            <div class="jdl-row">
              <label class="inputLabel inputLabelUnfocused" for="jdl-python">Python 解释器</label>
              <input id="jdl-python" type="text" class="emby-input jdl-input-inline" placeholder="留空 = 自动探测" />
              <span class="jdl-row__actions">
                <button id="jdl-python-install" type="button" is="emby-button" class="raised">安装 / 更换 Python</button>
              </span>
            </div>
            <div class="jdl-row">
              <span class="fieldDescription">留空自动探测（需 3.9+），也可手填路径。</span>
              <span id="jdl-python-line" class="fieldDescription"></span>
            </div>
          </div>

          <div class="inputContainer">
            <div class="jdl-row">
              <label class="inputLabel inputLabelUnfocused" for="jdl-media">媒体目录</label>
              <span class="fieldDescription">片库根目录，留空自动取 Jellyfin 的库路径。</span>
            </div>
            <div class="jdl-row">
              <input id="jdl-media" type="text" class="emby-input jdl-input-block" placeholder="留空 = 从 Jellyfin 解析" />
            </div>
          </div>

          <div class="inputContainer">
            <div class="jdl-row">
              <label class="inputLabel inputLabelUnfocused" for="jdl-staging">暂存目录</label>
              <span class="fieldDescription">下载先落这里，验证后再归档；留空即同盘 <code>.staging</code>。</span>
            </div>
            <div class="jdl-row">
              <input id="jdl-staging" type="text" class="emby-input jdl-input-block" placeholder="留空 = 媒体目录下的 .staging" />
            </div>
          </div>

          <div class="inputContainer">
            <div class="jdl-row">
              <label class="inputLabel inputLabelUnfocused">资源站</label>
              <span class="fieldDescription">后端从这些站收磁力候选。类型决定用哪段适配器；「网页搜索地址」填了才会走云盘通道（网址里要有 <code>{q}</code> 占位符）。整行留空 = 用内置默认的两个站。</span>
            </div>
            <div id="jdl-sites"></div>
            <button id="jdl-site-add" type="button" is="emby-button" class="raised">添加资源站</button>
          </div>

          <div class="inputContainer">
            <div class="jdl-row">
              <label class="inputLabel inputLabelUnfocused" for="jdl-keywords">L1 关键字组合</label>
              <span class="fieldDescription">每行一条，与片名拼成一条查询，按顺序排在搜索阶梯最前（发布者署名）。留空 = 用后端内置默认。</span>
            </div>
            <textarea id="jdl-keywords" class="emby-textarea jdl-input-block" rows="4" placeholder="留空 = 后端内置默认"></textarea>
          </div>

          <button id="jdl-save" type="button" is="emby-button" class="raised button-submit block">保存</button>
        </form>
      </div>
    </div>
  <script type="text/javascript">
    (function () {
      // Jellyfin 的视图容器会轮转保留多份页面，必须把查找范围钉在本页 div 上，
      // 否则 document.querySelector 可能命中隐藏的旧副本。
      var root = (document.currentScript && document.currentScript.closest('[data-role="page"]')) || document;
      function q(id) { return root.querySelector('#' + id); }

      if (!window.ApiClient || !ApiClient.ajax || !ApiClient.getUrl) {
        var statusNode = q('jdl-backend-status');
        if (statusNode) {
          statusNode.textContent = '请从 控制台 → 插件 → Jellyfin Downloader 打开本页（独立打开时缺少 ApiClient）';
        }
        return;
      }

      function pluginUrl(path) {
        var base = '/JellyfinDownloader/' + path;
        return window.ApiClient && ApiClient.getUrl ? ApiClient.getUrl(base) : base;
      }

      function ajax(type, path, data) {
        var options = { type: type, url: pluginUrl(path), dataType: 'json' };
        if (data !== undefined) {
          options.data = JSON.stringify(data);
          options.contentType = 'application/json';
        }
        return ApiClient.ajax(options);
      }

      function note(message) {
        if (window.Dashboard && Dashboard.alert) { Dashboard.alert(message); }
      }

      // Python：输入框留空即自动探测；这里回显「当前实际会用的解释器」
      function renderPython(status) {
        var line = q('jdl-python-line');
        if (!line) { return; }
        var found = status && (status.pythonFound || status.pythonOk);
        if (found && status.pythonOk) {
          line.textContent = '当前：' + status.python
            + (status.pythonVersion ? '（' + status.pythonVersion + '，' + status.pythonSource + '）' : '（' + status.pythonSource + '）');
          return;
        }
        if (found && !status.pythonOk) {
          line.textContent = '检测到 ' + status.python
            + (status.pythonVersion ? '（' + status.pythonVersion + '）' : '') + '，但需要 3.9+。';
        } else {
          line.textContent = '未检测到可用的 python3（后端需要 3.9+）。';
        }
      }

      function renderStatus(status) {
        var text = q('jdl-backend-status');
        var diag = q('jdl-backend-diag');
        if (!status) { text.textContent = '状态未知'; return; }
        var parts = [status.running ? '正在运行' : '已停止'];
        if (status.pid) { parts.push('pid ' + status.pid); }
        parts.push(status.managed ? '插件管理' : (status.running ? '外部进程' : '—'));
        text.textContent = parts.join(' · ');
        diag.textContent = status.scriptExists === false ? '脚本不存在：' + (status.script || '?') : '';
        renderPython(status);
      }

      function refreshStatus() {
        return ajax('GET', 'backend/status').then(renderStatus).catch(function (error) {
          q('jdl-backend-status').textContent = '状态读取失败：' + (error && error.status ? error.status : '网络错误');
        });
      }

      // 资源站列表：一行一个站，字段名与后端 source_config.py 的站点条目一一对应。
      // 服务端 JSON 是 camelCase（name/kind/baseUrl/webSearchUrl），提交时按 C# 属性名
      // （Name/Kind/BaseUrl/WebSearchUrl）发，模型绑定不区分大小写——两处都兼容着读。
      function siteField(labelText, field, value, options) {
        var wrap = document.createElement('label');
        wrap.className = 'jdl-site__field';
        var caption = document.createElement('span');
        caption.textContent = labelText;
        wrap.appendChild(caption);
        var input;
        if (options) {
          input = document.createElement('select');
          // 手改过 XML 的类型值不在选项里时，也要把它显示出来：否则 select 会落到第一项，
          // 用户看到的是「diao」、保存下去的也是「diao」——一次静默的数据改写。
          var choices = options.slice();
          if (value && choices.indexOf(value) < 0) { choices.push(value); }
          choices.forEach(function (option) {
            var node = document.createElement('option');
            node.value = option;
            node.textContent = option;
            input.appendChild(node);
          });
        } else {
          input = document.createElement('input');
          input.type = 'text';
        }
        input.className = 'emby-input';
        input.dataset.field = field;
        input.value = value || '';
        wrap.appendChild(input);
        return wrap;
      }

      function makeSiteRow(site) {
        site = site || {};
        var row = document.createElement('div');
        row.className = 'jdl-site';
        row.appendChild(siteField('名称', 'Name', site.Name || site.name));
        row.appendChild(siteField('类型', 'Kind', site.Kind || site.kind || 'diao', ['diao', 'torrents-csv']));
        row.appendChild(siteField('接口地址', 'BaseUrl', site.BaseUrl || site.baseUrl));
        row.appendChild(siteField('网页搜索地址（可选）', 'WebSearchUrl', site.WebSearchUrl || site.webSearchUrl));
        var remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'raised jdl-site__remove';
        remove.textContent = '删除';
        remove.addEventListener('click', function () { row.remove(); });
        row.appendChild(remove);
        return row;
      }

      function renderSites(sites) {
        var host = q('jdl-sites');
        host.innerHTML = '';
        (sites || []).forEach(function (site) { host.appendChild(makeSiteRow(site)); });
      }

      function readSites() {
        var rows = root.querySelectorAll('#jdl-sites .jdl-site');
        var out = [];
        for (var i = 0; i < rows.length; i++) {
          var value = function (field) {
            var node = rows[i].querySelector('[data-field="' + field + '"]');
            return node ? node.value.trim() : '';
          };
          var baseUrl = value('BaseUrl');
          var webSearchUrl = value('WebSearchUrl');
          if (!baseUrl && !webSearchUrl) { continue; }
          out.push({
            Name: value('Name'),
            Kind: value('Kind') || 'diao',
            BaseUrl: baseUrl,
            WebSearchUrl: webSearchUrl
          });
        }
        return out;
      }

      function readKeywords() {
        return (q('jdl-keywords').value || '')
          .split('\n')
          .map(function (line) { return line.trim(); })
          .filter(function (line) { return line.length > 0; });
      }

      function load() {
        ajax('GET', 'config').then(function (config) {
          q('jdl-port').value = config.BackendPort || 8123;
          q('jdl-staging').value = config.StagingRoot || '';
          q('jdl-media').value = config.MediaRoot || config.resolvedMediaRoot || '';
          q('jdl-python').value = config.BackendPython || '';
          renderSites(config.btSites || []);
          q('jdl-keywords').value = (config.l1Keywords || []).join('\n');
          return refreshStatus();
        }).catch(function (error) {
          q('jdl-backend-status').textContent = '配置读取失败：' + (error && error.status ? error.status : '网络错误');
        });
      }

      function save() {
        return ajax('POST', 'config', {
          BackendPort: parseInt(q('jdl-port').value, 10) || 8123,
          StagingRoot: (q('jdl-staging').value || '').trim(),
          MediaRoot: (q('jdl-media').value || '').trim(),
          BackendPython: (q('jdl-python').value || '').trim(),
          BtSites: readSites(),
          L1Keywords: readKeywords()
        });
      }

      function errorText(error, fallback) {
        if (error && error.responseJSON && error.responseJSON.error) {
          return error.responseJSON.error;
        }
        return fallback + (error && error.status ? error.status : '网络错误');
      }

      q('jdl-save').addEventListener('click', function () {
        q('jdl-backend-status').textContent = '正在保存…';
        save().then(function () {
          if (window.Dashboard && Dashboard.processPluginConfigurationUpdateResult) {
            Dashboard.processPluginConfigurationUpdateResult();
          }
          q('jdl-backend-status').textContent = '已保存（后端已重启），正在刷新状态…';
          return refreshStatus();
        }).catch(function (error) {
          q('jdl-backend-status').textContent = '保存失败：' + errorText(error, '');
        });
      });

      q('jdl-site-add').addEventListener('click', function () {
        q('jdl-sites').appendChild(makeSiteRow({}));
      });

      q('jdl-backend-refresh').addEventListener('click', function () {
        q('jdl-backend-status').textContent = '正在刷新…';
        refreshStatus();
      });

      q('jdl-python-install').addEventListener('click', function () {
        var line = q('jdl-python-line');
        line.textContent = '正在准备安装…';
        ajax('POST', 'python/install', {}).then(function (result) {
          if (result && result.status) { renderPython(result.status); }
          var lines = [(result && result.detail) || '已给出安装指引'];
          if (result && result.command) { lines.push('推荐命令：' + result.command); }
          if (result && result.url) { lines.push('下载页：' + result.url); }
          line.textContent = lines.join('　·　');
          setTimeout(refreshStatus, 2000);
        }).catch(function (error) {
          line.textContent = '安装指引获取失败：' + (error && error.status ? error.status : '网络错误');
        });
      });

      q('jdl-backend-restart').addEventListener('click', function () {
        q('jdl-backend-status').textContent = '正在重启…';
        ajax('POST', 'backend/restart', {}).then(function (result) {
          if (result && result.detail) { note(result.detail); }
          renderStatus(result && result.status);
        }).catch(function (error) {
          q('jdl-backend-status').textContent = '重启失败：' + (error && error.status ? error.status : '网络错误');
          refreshStatus();
        });
      });

      load();
    })();
  </script>
  </div>
</body>
</html>
